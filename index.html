<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aov Mod - Trang Tải Xuống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans antialiased">

    <div class="relative min-h-screen flex flex-col items-center justify-center p-4">
        <div class="absolute inset-0 bg-cover bg-center opacity-20 pointer-events-none" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000');"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent pointer-events-none"></div>

        <div class="relative z-10 w-full max-w-md space-y-6 text-center">
            
            <div class="glass-card p-6 rounded-3xl neon-border">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=200" alt="Avatar" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-blue-500 object-cover">
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">AOV MOD STORE</h1>
                <p class="text-xs text-slate-400 mt-1">Phiên bản mới nhất - An toàn tuyệt đối</p>
            </div>

            <div class="glass-card p-6 rounded-3xl space-y-4 text-left">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider text-center">Hoàn thành nhiệm vụ để mở khóa</h2>
                
                <div id="task-1" class="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-800 cursor-pointer hover:bg-slate-800 transition" onclick="runTask(1, 'https://t.me')">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">1</div>
                        <span class="text-sm font-medium">Tham gia nhóm Telegram</span>
                    </div>
                    <span class="status-icon text-xs px-2 py-1 rounded bg-slate-800 text-slate-400">Chờ 3s</span>
                </div>

                <div id="task-2" class="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-800 cursor-pointer hover:bg-slate-800 transition" onclick="runTask(2, 'https://youtube.com')">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-red-500/20 text-red-400 flex items-center justify-center font-bold">2</div>
                        <span class="text-sm font-medium">Đăng ký kênh YouTube</span>
                    </div>
                    <span class="status-icon text-xs px-2 py-1 rounded bg-slate-800 text-slate-400">Chờ 3s</span>
                </div>
            </div>

            <button id="unlock-btn" onclick="handleRedirect()" disabled class="w-full py-4 rounded-2xl font-bold text-lg transition-all duration-300 bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed shadow-lg">
                Mở Khóa Liên Kết
            </button>
        </div>
    </div>

    <script>
        const completedTasks = new Set();
        const totalTasks = 2;

        function runTask(id, url) {
            const taskElement = document.getElementById(`task-${id}`);
            const statusIcon = taskElement.querySelector('.status-icon');
            
            if (completedTasks.has(id)) {
                window.open(url, '_blank');
                return;
            }

            statusIcon.innerText = "Đang đếm...";
            statusIcon.className = "status-icon text-xs px-2 py-1 rounded bg-amber-500/20 text-amber-400 animate-pulse";

            window.open(url, '_blank');

            setTimeout(() => {
                completedTasks.add(id);
                statusIcon.innerText = "✓ Xong";
                statusIcon.className = "status-icon text-xs px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 font-bold";
                taskElement.classList.add('border-emerald-500/50');
                
                checkCompletion();
            }, 3000);
        }

        function checkCompletion() {
            if (completedTasks.size === totalTasks) {
                const btn = document.getElementById('unlock-btn');
                btn.disabled = false;
                btn.className = "w-full py-4 rounded-2xl font-bold text-lg transition-all duration-300 bg-gradient-to-r from-blue-600 to-indigo-600 text-white neon-border hover:opacity-90 cursor-pointer shadow-blue-500/30 shadow-lg transform hover:-translate-y-1";
            }
        }

        function handleRedirect() {
            if (completedTasks.size === totalTasks) {
                window.location.href = 'https://link1s.com/duong_link_rut_gon_cua_ban';
            }
        }
    </script>
</body>
</html>
