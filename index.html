<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1710.io.vn | KHU VỰC CẤM ĐỊA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Quicksand:wght@500;700&display=swap');

    :root {
      --bg-dark: #0b0c10;
      --neon-pink: #ff2a85;
      --neon-cyan: #00f3ff;
      --warn-yellow: #fcee0a;
      --card-bg: rgba(20, 22, 34, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 42, 133, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Dải băng cảnh báo chạy ngang kiểu Anime */
    .hazard-tape {
      position: fixed;
      left: -10%;
      width: 120%;
      height: 32px;
      background: repeating-linear-gradient(
        -45deg,
        var(--warn-yellow),
        var(--warn-yellow) 20px,
        #111 20px,
        #111 40px
      );
      color: #000;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 3px;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(252, 238, 10, 0.4);
      z-index: 10;
    }

    .tape-top {
      top: 18px;
      transform: rotate(-1.5deg);
    }

    .tape-bottom {
      bottom: 18px;
      transform: rotate(1.5deg);
    }

    .tape-text {
      background: #111;
      color: var(--warn-yellow);
      padding: 2px 16px;
      border: 1px solid var(--warn-yellow);
    }

    /* Khung nội dung chính */
    .container {
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(255, 42, 133, 0.15);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .badge {
      display: inline-block;
      background: var(--neon-pink);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 50px;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      box-shadow: 0 0 12px var(--neon-pink);
      animation: pulse 1.5s infinite;
    }

    .anime-emoji {
      font-size: 56px;
      margin-bottom: 12px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }

    h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 28px;
      text-transform: uppercase;
      color: var(--warn-yellow);
      text-shadow: 2px 2px 0px var(--neon-pink);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .dialogue-box {
      background: rgba(0, 0, 0, 0.55);
      border-left: 4px solid var(--neon-pink);
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      margin: 18px 0;
      font-size: 15.5px;
      line-height: 1.6;
      color: #e0e6ed;
    }

    .dialogue-box strong {
      color: var(--neon-cyan);
    }

    /* Thanh tiến trình giả lập */
    .progress-wrapper {
      margin: 22px 0;
      text-align: left;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 13px;
      color: var(--neon-cyan);
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #1a1d2e;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.4);
    }

    .progress-fill {
      width: 69%;
      height: 100%;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      border-radius: 10px;
      animation: loadingGlow 2s infinite alternate;
    }

    /* Nút bấm troll */
    .btn-troll {
      background: transparent;
      color: var(--warn-yellow);
      border: 2px solid var(--warn-yellow);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .btn-troll:hover {
      background: var(--warn-yellow);
      color: #000;
      box-shadow: 0 0 20px var(--warn-yellow);
      transform: scale(1.04);
    }

    #secret-msg {
      margin-top: 16px;
      font-size: 14.5px;
      color: var(--neon-pink);
      font-weight: 700;
      min-height: 22px;
    }

    .footer-tag {
      margin-top: 20px;
      font-size: 12px;
      color: #7f8c8d;
      font-family: 'Chakra Petch', sans-serif;
    }
